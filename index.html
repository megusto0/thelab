<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторные работы по СПИВТ</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f3f4f6;
        color: #1f2933;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
      }

      main {
        width: min(960px, 100vw);
        padding: 1.5rem;
        box-sizing: border-box;
      }

      h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        margin-bottom: 1rem;
        text-align: center;
      }

      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .form-group {
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      label {
        font-weight: 600;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
        padding: 0.75rem;
        border-radius: 8px;
        border: 1px solid #d0d7de;
        font-size: 1rem;
        line-height: 1.5;
      }

      .modes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .mode-option {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.75rem;
        border-radius: 20px;
        background: #eef2ff;
      }

      button {
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        font-size: 1.1rem;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(29, 78, 216, 0.22);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .result-card {
        border-left: 4px solid #2563eb;
      }

      .result-card h2 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      .result-content {
        background: #111827;
        color: #f9fafb;
        border-radius: 8px;
        padding: 1rem;
        overflow-x: auto;
        font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .note {
        font-size: 0.9rem;
        color: #4b5563;
      }

      @media (max-width: 640px) {
        .card {
          padding: 1.25rem;
        }

        .modes {
          flex-direction: column;
          align-items: flex-start;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Лабораторные работы по СПИВТ</h1>
        <div class="form-group">
          <label for="message">Введите сообщение для обработки</label>
          <textarea
            id="message"
            placeholder="Например: тестовое сообщение для демонстрации алгоритмов..."
          ></textarea>
        </div>
        <div class="form-group">
          <label>Выберите режим обработки</label>
          <div class="modes" role="radiogroup">
            <label class="mode-option">
              <input type="radio" name="mode" value="compress" checked />
              Сжатие (Huffman)
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="hamming" />
              Помехоустойчивость (Hamming)
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="encrypt" />
              Шифрование (Vigenère)
            </label>
          </div>
        </div>
        <p class="note">
          Убедитесь, что Flask-сервер запущен и замените адрес сервера на ваш IP в коде
          ниже перед использованием на мобильном устройстве.
        </p>
        <button id="sendBtn" type="button">Отправить на сервер</button>
      </section>

      <section class="card result-card">
        <h2>Результат обработки на сервере</h2>
        <div id="status" class="note">Ответ сервера появится здесь после отправки.</div>
        <pre id="result" class="result-content">{}</pre>
      </section>
    </main>

    <script>
      const SERVER_URL = "http://<YOUR_LAPTOP_IP>:5000/process";

      const messageField = document.getElementById("message");
      const sendButton = document.getElementById("sendBtn");
      const statusField = document.getElementById("status");
      const resultField = document.getElementById("result");

      function getSelectedMode() {
        const selected = document.querySelector('input[name="mode"]:checked');
        return selected ? selected.value : "compress";
      }

      function setLoadingState(isLoading) {
        sendButton.disabled = isLoading;
        statusField.textContent = isLoading
          ? "Отправляем данные на сервер..."
          : "Ответ сервера появится здесь после отправки.";
      }

      async function sendToServer() {
        const message = messageField.value.trim();
        const mode = getSelectedMode();

        if (!message) {
          statusField.textContent = "Пожалуйста, введите сообщение перед отправкой.";
          resultField.textContent = "{}";
          return;
        }

        try {
          setLoadingState(true);
          const response = await fetch(SERVER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, mode }),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Не удалось получить корректный ответ сервера.");
          }

          statusField.textContent = "Обработка выполнена успешно.";
          resultField.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          statusField.textContent = `Ошибка: ${error.message}`;
          resultField.textContent = "{}";
        } finally {
          setLoadingState(false);
        }
      }

      sendButton.addEventListener("click", sendToServer);
    </script>
  </body>
</html>
